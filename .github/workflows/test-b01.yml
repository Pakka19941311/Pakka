name: Motion validation and Windows test build

on:
  push:
    branches: [work/v06-commercial-rebuild]
    paths-ignore: ['docs/**', PROJECT_RULES.md, scripts/motion-profile.mjs, .github/workflows/motion-profile.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    # Profiling-only checkpoints have their own job and must not republish accepted B01.
    if: ${{ !contains(github.event.head_commit.message, '[motion-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Unit tests, production build, real asset lifecycle
        run: |
          npm ci
          npm test
          npm run build
          npm run smoke
          node --input-type=module -e "import{readdirSync,readFileSync}from'node:fs';for(const file of readdirSync('dist/assets').filter(f=>f.endsWith('.js')))if(readFileSync('dist/assets/'+file,'utf8').includes('__VARENDOR_FIXTURE__'))throw Error('Test fixture leaked into production');"
      - name: Save production build for Windows validation
        uses: actions/upload-artifact@v4
        with:
          name: production
          path: |
            dist
            server.ps1
            packaging/windows/RUN_VARENDOR.bat
            packaging/windows/README_B01_RU.txt
          retention-days: 14
      - name: Prepare isolated browser regression build
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          VARENDOR_QA=1 npx vite build --outDir dist-qa --sourcemap
          google-chrome --version
      - name: Real WebGL gameplay and respawn smoke
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
          MOTION_RANGED_ONLY: ${{ contains(github.event.head_commit.message, '[input-edge-final]') && '1' || '0' }}
        run: npm run test:browser
      - name: Check out unchanged baseline for comparison
        if: ${{ !contains(github.event.head_commit.message, '[contact-final]') }}
        uses: actions/checkout@v4
        with:
          ref: 752fb581bbddc4995270df797c58700fb62a8c34
          path: baseline
      - name: Compare baseline on the same software-rendering runner
        if: ${{ !contains(github.event.head_commit.message, '[contact-final]') }}
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm ci --prefix baseline
          cd baseline
          VARENDOR_QA=1 npx vite build --outDir dist-qa --sourcemap
          cd ..
          node scripts/motion-profile.mjs baseline/dist-qa before
          node scripts/motion-profile.mjs dist-qa after
      # Only combat contact/spacing and build labels change in this final candidate. Keep the
      # completed same-runner graphics profile rather than repeat those GPU windows.
      - name: Include completed movement comparison from b860d29b
        if: ${{ contains(github.event.head_commit.message, '[contact-final]') }}
        uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          run-id: 33963345742
          github-token: ${{ github.token }}
          path: qa-artifacts/profile-reference
      - name: Include completed shared gameplay checks from 6e0d564c
        if: ${{ contains(github.event.head_commit.message, '[input-edge-final]') }}
        uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          run-id: 33964607324
          github-token: ${{ github.token }}
          path: qa-artifacts/gameplay-reference
      - name: Save screenshots and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            qa-artifacts
            dist-qa/assets/*.js.map
            baseline/dist-qa/assets/*.js.map
          retention-days: 30

  windows-launcher:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: build
      - name: Test Windows PowerShell launcher and actual asset HTTP responses
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$pwd/build/server.ps1",'-NoBrowser' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $page = Invoke-WebRequest http://localhost:4173/ -UseBasicParsing; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Windows launcher did not start' }
            if ($page.Content -notmatch 'Varendor') { throw 'Wrong HTML' }
            $scripts = [regex]::Matches($page.Content, 'src="([^"]+\.js)"')
            if ($scripts.Count -eq 0) { throw 'No production entry script' }
            foreach ($script in $scripts) {
              $asset = Invoke-WebRequest ("http://localhost:4173" + $script.Groups[1].Value + '?launcher-test=1') -UseBasicParsing
              if ($asset.Headers['Content-Type'] -notmatch 'javascript') { throw 'JS MIME is incorrect' }
              if ($asset.Content.StartsWith('<!DOCTYPE')) { throw 'JS route returned HTML' }
              if ($asset.RawContentLength -lt 1000) { throw 'Entry script truncated' }
            }
            $model = Get-ChildItem build/dist/assets/models -Recurse -Filter *.glb | Select-Object -First 1
            $relative = $model.FullName.Substring((Resolve-Path build/dist).Path.Length).Replace('\','/')
            $modelResponse = Invoke-WebRequest ("http://localhost:4173" + $relative) -UseBasicParsing
            if ($modelResponse.RawContentLength -ne $model.Length) { throw 'GLB transfer length mismatch' }
            Write-Host 'PASS Windows launcher: HTML, JS MIME, query routes, complete GLB'
          } finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id } }

  package:
    needs: [validate, windows-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: production
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: qa-artifacts
      - name: Package verified Windows build
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          stage="Varendor_Motion_Windows_Test_${short_sha}"
          mkdir "$stage"
          cp -a production/dist "$stage/dist"
          cp production/server.ps1 "$stage/"
          cp production/packaging/windows/RUN_VARENDOR.bat "$stage/"
          cp production/packaging/windows/README_B01_RU.txt "$stage/README_RU.txt"
          cp docs/MOTION_COMBAT_QA.md "$stage/QA_REPORT_RU.md"
          printf '%s\n' "$GITHUB_SHA" > "$stage/BUILD_COMMIT.txt"
          zip -q -9 -r "${stage}.zip" "$stage"
          unzip -t "${stage}.zip" | tail -1
          sha256sum "${stage}.zip" > "${stage}.zip.sha256"
          stat -c '%n %s bytes' "${stage}.zip"
          cat "${stage}.zip.sha256"
          zip -q -r "Motion_QA_${short_sha}.zip" qa-artifacts
      - name: Publish immutable prerelease, never merge main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="v0.6-motion-test-${short_sha}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Varendor — Motion / Combat Test (${short_sha})" \
            --notes "Тест доработки текущего блока: отклик управления, фазы анимаций, ближний и дальний бой, контакт тел и камера у препятствий. Windows ZIP: распаковать целиком, запустить RUN_VARENDOR.bat. Следующий блок ждёт принятия пользователем. main не изменён. CI WebGL использует software GPU, результаты не являются FPS-прогнозом для вашего ПК." \
            "Varendor_Motion_Windows_Test_${short_sha}.zip" "Varendor_Motion_Windows_Test_${short_sha}.zip.sha256" \
            "Motion_QA_${short_sha}.zip"
