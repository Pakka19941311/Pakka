name: HUD B validation and Windows test build

on:
  push:
    branches: [work/v06-commercial-rebuild]
    paths-ignore: ['docs/**', PROJECT_RULES.md, scripts/motion-profile.mjs, .github/workflows/motion-profile.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    # Profiling-only checkpoints have their own job and must not publish an inventory candidate.
    if: ${{ github.ref == 'refs/heads/work/v06-commercial-rebuild' && !contains(github.event.head_commit.message, '[motion-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Unit tests, production build, real asset lifecycle
        run: |
          npm ci
          npm test
          npm run build
          npm run smoke
          node --input-type=module -e "import{readdirSync,readFileSync}from'node:fs';for(const file of readdirSync('dist/assets').filter(f=>f.endsWith('.js')))if(readFileSync('dist/assets/'+file,'utf8').includes('__VARENDOR_FIXTURE__'))throw Error('Test fixture leaked into production');"
      - name: Save production build for Windows validation
        uses: actions/upload-artifact@v4
        with:
          name: production
          path: |
            dist
            server.ps1
            packaging/windows/RUN_VARENDOR.bat
            packaging/windows/README_B_RU.txt
          retention-days: 14
      - name: Prepare isolated browser regression build
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          VARENDOR_QA=1 npx vite build --outDir dist-qa --sourcemap
          google-chrome --version
      - name: Block B production HUD and isolated consumable regressions
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node scripts/hud-regression.mjs dist production
          node scripts/hud-regression.mjs dist-qa
      - name: Block C production inventory and isolated item regressions
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node scripts/inventory-regression.mjs dist production
          node scripts/inventory-regression.mjs dist-qa
      - name: Current SHA regression for accepted E combat and classes
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node scripts/combat-intent-regression.mjs dist production
          node scripts/combat-intent-regression.mjs dist-qa
      - name: Current SHA regression for accepted A world, input and death
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node scripts/live-world-regression.mjs dist production
          node scripts/live-world-regression.mjs dist-qa
      - name: Save screenshots and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: qa-artifacts
          retention-days: 30

  windows-launcher:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: build
      - name: Test Windows PowerShell launcher and actual asset HTTP responses
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$pwd/build/server.ps1",'-NoBrowser' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $page = Invoke-WebRequest http://localhost:4173/ -UseBasicParsing; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Windows launcher did not start' }
            if ($page.Content -notmatch 'Varendor') { throw 'Wrong HTML' }
            $scripts = [regex]::Matches($page.Content, 'src="([^"]+\.js)"')
            if ($scripts.Count -eq 0) { throw 'No production entry script' }
            foreach ($script in $scripts) {
              $asset = Invoke-WebRequest ("http://localhost:4173" + $script.Groups[1].Value + '?launcher-test=1') -UseBasicParsing
              if ($asset.Headers['Content-Type'] -notmatch 'javascript') { throw 'JS MIME is incorrect' }
              if ($asset.Content.StartsWith('<!DOCTYPE')) { throw 'JS route returned HTML' }
              if ($asset.RawContentLength -lt 1000) { throw 'Entry script truncated' }
            }
            $model = Get-ChildItem build/dist/assets/models -Recurse -Filter *.glb | Select-Object -First 1
            $relative = $model.FullName.Substring((Resolve-Path build/dist).Path.Length).Replace('\','/')
            $modelResponse = Invoke-WebRequest ("http://localhost:4173" + $relative) -UseBasicParsing
            if ($modelResponse.RawContentLength -ne $model.Length) { throw 'GLB transfer length mismatch' }
            Write-Host 'PASS Windows launcher: HTML, JS MIME, query routes, complete GLB'
          } finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id } }

  package:
    needs: [validate, windows-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production
          path: production
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: qa-artifacts
      - name: Package verified Windows build
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          stage="Varendor_HUD_B_Windows_Test_${short_sha}"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const expected = new Map([
            ['B-production-hud.json', 'B-production'],
            ['B-hud.json', 'B'],
            ['C-production-inventory.json', 'C-production'],
            ['C-inventory.json', 'C'],
            ['E-production-combat-intent.json', 'E-production'],
            ['E-combat-intent.json', 'E'],
            ['A-production-live-world.json', 'A-production'],
            ['A-live-world.json', 'A'],
          ]);
          for (const [file, block] of expected) {
            const report = JSON.parse(readFileSync(`qa-artifacts/${file}`, 'utf8'));
            assert.equal(report.block, block, `${file}: wrong block`);
            assert.equal(report.sha, process.env.GITHUB_SHA, `${file}: wrong SHA`);
            assert.equal(report.passed, true, `${file}: failed`);
            assert.deepEqual(report.errors, [], `${file}: runtime errors`);
            assert.ok(Array.isArray(report.checks) && report.checks.length > 0, `${file}: missing checks`);
            console.log(`PASS evidence ${file}: ${report.checks.length} checks, SHA ${report.sha}`);
          }
          JS
          mkdir "$stage"
          cp -a production/dist "$stage/dist"
          cp production/server.ps1 "$stage/"
          cp production/packaging/windows/RUN_VARENDOR.bat "$stage/"
          cp production/packaging/windows/README_B_RU.txt "$stage/README_RU.txt"
          cp docs/HUD_QA.md "$stage/QA_REPORT_RU.md"
          cp docs/BLOCK_SPEC_V2_RU.md "$stage/TZ_V2_RU.md"
          cp docs/ENHANCEMENT_BALANCE_V2.json "$stage/ENHANCEMENT_BALANCE_V2.json"
          cp qa-artifacts/B-hud.json qa-artifacts/B-production-hud.json qa-artifacts/C-inventory.json qa-artifacts/C-production-inventory.json qa-artifacts/E-combat-intent.json qa-artifacts/E-production-combat-intent.json qa-artifacts/A-live-world.json qa-artifacts/A-production-live-world.json "$stage/"
          printf '\nФактический результат выпуска: обязательные gates CI выполнены успешно для %s. B production/QA и регрессии C/E/A production/QA: passed=true, ошибок нет, SHA совпадает. Windows launcher: PASS. Статус сборки: awaiting_user_test; СТОП до принятия B.\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$stage/QA_REPORT_RU.md"
          printf '%s\n' "$GITHUB_SHA" > "$stage/BUILD_COMMIT.txt"
          zip -q -9 -r "${stage}.zip" "$stage"
          unzip -t "${stage}.zip" | tail -1
          sha256sum "${stage}.zip" > "${stage}.zip.sha256"
          stat -c '%n %s bytes' "${stage}.zip"
          cat "${stage}.zip.sha256"
          zip -q -r "HUD_B_QA_${short_sha}.zip" qa-artifacts
          unzip -t "HUD_B_QA_${short_sha}.zip" | tail -1
      - name: Publish immutable prerelease, never merge main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          tag="v0.6-hud-b-test-${short_sha}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Varendor — HUD B Test (${short_sha})" \
            --notes "Блок B: компактный HUD, HP/MP снизу, миникарта слева сверху, реальные эффекты, журнал с фильтрами, 2–4 ряда по 8 быстрых слотов, сохранение назначений и общий запас расходников. Регрессии C/E/A на этом же SHA. Новая заточка D ещё не внедрена. Windows: распаковать целиком и запустить RUN_VARENDOR.bat. СТОП до принятия B. main не изменён. CI software WebGL не является аппаратным FPS-тестом." \
            "Varendor_HUD_B_Windows_Test_${short_sha}.zip" "Varendor_HUD_B_Windows_Test_${short_sha}.zip.sha256" \
            "HUD_B_QA_${short_sha}.zip"
