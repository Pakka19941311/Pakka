name: Part 1 checkpoint validation

on:
  push:
    branches: [work/v06-commercial-rebuild]
    paths-ignore: ['docs/**', PROJECT_RULES.md, scripts/motion-profile.mjs, .github/workflows/motion-profile.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/work/v06-commercial-rebuild' && !contains(github.event.head_commit.message, '[world-assets]') && !contains(github.event.head_commit.message, '[motion-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VARENDOR_BETA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Check changed world and server contracts
        run: |
          npm ci
          npm run test:part1
          node --experimental-strip-types scripts/world-server-regression.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified approved source derivatives when absent
        run: |
          if [ ! -f public/assets/world/prepared-assets.json ]; then
            python -m pip install numpy==2.5.2 scipy==1.17.0 Pillow==12.3.0 fast-simplification==0.2.0
            python scripts/fetch-world-assets.py world-source
            python scripts/prepare-world-assets.py world-source
          fi
      - name: Build checkpoint and verify local asset references
        run: npm run build
      - name: Render only the changed environment in project CI
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          VARENDOR_QA=1 npx vite build --outDir dist-qa
          node scripts/world-environment-regression.mjs dist-qa
      - name: Preserve generated game assets in the working branch
        run: |
          git add public/assets/world
          if git diff --cached --quiet; then exit 0; fi
          remote_sha=$(git ls-remote origin refs/heads/work/v06-commercial-rebuild | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'Working branch advanced; asset commit cancelled without reset or force push.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(world): preserve approved nature derivatives [world-assets]'
          git push origin HEAD:refs/heads/work/v06-commercial-rebuild
      - name: Preserve checkpoint evidence, not a user release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part1-checkpoint-evidence
          path: |
            qa-artifacts
            public/assets/world/prepared-assets.json
          retention-days: 30
