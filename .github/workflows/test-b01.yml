name: Part 1 checkpoint validation

on:
  push:
    branches: [work/v06-commercial-rebuild]
    paths-ignore: ['docs/**', PROJECT_RULES.md, scripts/motion-profile.mjs, .github/workflows/motion-profile.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/work/v06-commercial-rebuild' && !contains(github.event.head_commit.message, '[world-assets]') && !contains(github.event.head_commit.message, '[motion-profile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VARENDOR_BETA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Check the changed server and client boundary
        run: |
          npm ci
          node --experimental-strip-types --test tests/persistent-world.test.mjs tests/beta-import.test.mjs tests/server-combat-parity.test.mjs tests/remote-world-client.test.mjs tests/world-stream.test.mjs tests/world-package.test.mjs
      - name: Build checkpoint and verify local asset references
        run: npm run build
      - name: Exercise the production game with two clients of a dedicated server
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          node --experimental-strip-types scripts/world-client-regression.mjs dist
      - name: Preserve checkpoint evidence, not a user release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part1-checkpoint-evidence
          path: |
            qa-artifacts
            public/assets/world/prepared-assets.json
            public/assets/world/world-topology.json
          retention-days: 30
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VARENDOR_BETA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the changed Windows server package
        run: |
          npm ci
          npm run build
          node scripts/package-world-windows.mjs --commit $env:GITHUB_SHA --output release-output
      - name: Start the shipped Windows launcher and retain a world across package folders
        run: |
          $packageName = 'Varendor_Part1_Windows_Test_' + $env:GITHUB_SHA.Substring(0, 12)
          Expand-Archive -LiteralPath (Join-Path 'release-output' ($packageName + '.zip')) -DestinationPath 'verified-extract'
          node scripts/windows-world-smoke.mjs (Join-Path 'verified-extract' $packageName) | Tee-Object -FilePath release-output/windows-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the Windows checkpoint, not a user release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part1-windows-checkpoint
          path: |
            release-output/*.zip.sha256
            release-output/windows-smoke.json
            release-output/Varendor*/BUILD_COMMIT.txt
            release-output/Varendor*/PACKAGE_MANIFEST.json
          retention-days: 30
