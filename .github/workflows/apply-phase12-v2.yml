name: Apply Phase 1.2 Correction v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize_phase12.py'
      - '.github/workflows/apply-phase12-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply authored correction
        run: python3 scripts/apply_phase12.py

      - name: Remove obsolete guardrail contract
        run: python3 scripts/finalize_phase12.py

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Unit and contract tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified correction
        run: |
          git config user.name "Pakka19941311"
          git config user.email "nikitatonn1994@gmail.com"
          git add -A
          git commit -m "feat: rebuild Greenfall ecology and combat readability"
          git push origin HEAD:main
