name: P0 frame pacing diagnosis
on:
  push:
    branches: [work/godot-p1-recovery]
permissions:
  contents: read
jobs:
  measure:
    concurrency:
      group: p0-frame-pacing-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ contains(github.event.head_commit.message, '[pacing-probe]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          python scripts/godot-pc-toolchain.py
          npm ci
      - uses: actions/cache/restore@v4
        id: world_cache
        with:
          path: |
            godot-pc/generated/world.glb
            godot-pc/generated/blender-build.json
            godot-pc/generated/wildlife/
            world-source/Varendor_PC_World.blend
          key: territory-blender-4.5.9-${{ hashFiles('scripts/godot-pc-world.py', 'scripts/territory_art.py', 'src/world/territory-layout.ts', 'src/world/territory.ts', 'public/assets/world/world-topology.json') }}
      - name: Prepare the unchanged scene and isolated measurement copy
        run: |
          node --experimental-strip-types scripts/godot-pc-data.mjs
          if [ "${{ steps.world_cache.outputs.cache-hit }}" != true ]; then "$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/godot-pc-world.py; fi
          cp -a godot-pc "$RUNNER_TEMP/pacing-before"
          for file in main.gd network.gd; do git show 629cdef571c81473725acc88afe59385e2fcd518:godot-pc/scripts/$file > "$RUNNER_TEMP/pacing-before/scripts/$file"; done
          python scripts/pacing/instrument.py "$RUNNER_TEMP/pacing-before"
          "$GODOT" --headless --path "$RUNNER_TEMP/pacing-before" --editor --import 2>&1 | tee "$RUNNER_TEMP/pacing-before-import.log"
          cp -a "$RUNNER_TEMP/pacing-before" "$RUNNER_TEMP/pacing-project"
          cp -a godot-pc/scripts/. "$RUNNER_TEMP/pacing-project/scripts/"
          python scripts/pacing/instrument.py "$RUNNER_TEMP/pacing-project"
          "$GODOT" --headless --path "$RUNNER_TEMP/pacing-project" --editor --import 2>&1 | tee "$RUNNER_TEMP/pacing-import.log"
          python -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"pacing-import.log").read_text(); assert "SCRIPT ERROR:" not in s and "Parse Error:" not in s,s[-18000:]'
      - name: Paired baseline and candidate CPU frame pacing on the same runner
        run: |
          node --experimental-strip-types scripts/pacing/run.mjs "$GODOT" "$RUNNER_TEMP/pacing-before" qa-artifacts/pacing/before-headless --headless
          node --experimental-strip-types scripts/pacing/run.mjs "$GODOT" "$RUNNER_TEMP/pacing-project" qa-artifacts/pacing/after-headless --headless
      - name: Record unchanged rain scene with native graphics
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[pacing-headless]') }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' node --experimental-strip-types scripts/pacing/run.mjs "$GODOT" "$RUNNER_TEMP/pacing-before" qa-artifacts/pacing/before-graphics --short
          xvfb-run -a -s '-screen 0 1600x900x24' node --experimental-strip-types scripts/pacing/run.mjs "$GODOT" "$RUNNER_TEMP/pacing-project" qa-artifacts/pacing/after-graphics --short
      - name: Record actual 3838 x 2158 in a fresh native process
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[pacing-headless]') }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 3838x2158x24' node --experimental-strip-types scripts/pacing/run.mjs "$GODOT" "$RUNNER_TEMP/pacing-project" qa-artifacts/pacing/after-4k --resolution=3838x2158 --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-frame-pacing-evidence
          path: qa-artifacts/pacing/
          retention-days: 30
