name: Godot PC preview

on:
  push:
    branches: [work/godot-migration-p0, work/godot-p1-recovery]

permissions:
  contents: write

concurrency:
  group: godot-pc-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build:
    if: ${{ contains(github.event.head_commit.message, '[pc-preview]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native graphics dependencies and pinned build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          python scripts/godot-pc-toolchain.py
          npm ci
      - name: Verify changed gameplay scenarios
        run: node --experimental-strip-types --test tests/combat-feedback.test.mjs tests/native-recovery.test.mjs tests/monster-ai.test.mjs tests/control-foundation.test.mjs tests/inventory-commands.test.mjs tests/enhancement-v2.test.mjs
      - name: Assemble the existing world in Blender
        run: |
          node --experimental-strip-types scripts/godot-pc-data.mjs
          "$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/godot-pc-world.py
      - name: Build original P1 world samples
        run: '"$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/godot-pc-samples.py'
      - name: Import and export the native clients
        id: native_export
        run: |
          mkdir -p qa-artifacts/pc-build
          "$GODOT" --headless --path godot-pc --editor --import
          "$GODOT" --headless --path godot-pc --export-release 'Linux QA' "$PWD/qa-artifacts/pc-build/Varendor.x86_64"
          "$GODOT" --headless --path godot-pc --export-release 'Windows PC' "$PWD/qa-artifacts/pc-build/Varendor.exe"
          cp godot-pc/generated/blender-build.json qa-artifacts/pc-build/
      - name: Exercise native Godot graphics and the save adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1600x900x24' node --experimental-strip-types scripts/godot-pc-qa.mjs qa-artifacts/pc-build/Varendor.x86_64 qa-artifacts/pc-linux --graphical
      - name: Verify original samples in native Godot
        if: ${{ !cancelled() && steps.native_export.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' qa-artifacts/pc-build/Varendor.x86_64 --audio-driver Dummy -- --world-samples --qa-art="$PWD/qa-artifacts/pc-linux/samples"
          cp -r world-source/p1-samples qa-artifacts/pc-build/
          cp godot-pc/generated/p1-samples.glb qa-artifacts/pc-build/p1-samples/
      - uses: actions/upload-artifact@v4
        with:
          name: godot-pc-windows-input
          path: |
            qa-artifacts/pc-build/Varendor.exe
            qa-artifacts/pc-build/blender-build.json
            qa-artifacts/pc-build/p1-samples/
            qa-artifacts/pc-linux/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pc-native-evidence
          path: qa-artifacts/pc-linux/
          retention-days: 30

  windows-package:
    needs: native-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: godot-pc-windows-input
          path: qa-artifacts
      - name: Package Windows with the portable server
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force godot-pc/generated | Out-Null
          Copy-Item qa-artifacts/pc-build/blender-build.json godot-pc/generated/blender-build.json
          node scripts/package-godot-pc.mjs qa-artifacts/pc-build/Varendor.exe qa-artifacts/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the shipped Windows executable and portable Node against fixture data
        run: |
          $package = Join-Path $PWD ('qa-artifacts/release/Varendor_Godot_PC_' + $env:GITHUB_SHA.Substring(0,12))
          & (Join-Path $package 'runtime/node.exe') --experimental-strip-types scripts/godot-pc-qa.mjs (Join-Path $package 'Varendor.exe') qa-artifacts/pc-windows ("--package=" + $package)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the test ZIP and verify public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-godot-pc.mjs qa-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pc-release-evidence
          path: |
            qa-artifacts/pc-windows/
            qa-artifacts/release/publish-result.json
            qa-artifacts/release/*.sha256
          retention-days: 30
