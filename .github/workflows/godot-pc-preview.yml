name: Godot PC preview

on:
  push:
    branches: [work/godot-migration-p0, work/godot-p1-recovery]

permissions:
  contents: write

env:
  VARENDOR_QA_SCOPE: ${{ contains(github.event.head_commit.message, '[pc-polish]') && 'polish' || contains(github.event.head_commit.message, '[pc-world]') && 'world' || contains(github.event.head_commit.message, '[pc-forward-stop]') && 'stop-only' || contains(github.event.head_commit.message, '[pc-stop-npc]') && 'stop-npc' || 'full' }}

concurrency:
  group: godot-pc-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    if: ${{ contains(github.event.head_commit.message, '[pc-preview]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native graphics dependencies and pinned build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          python scripts/godot-pc-toolchain.py
          npm ci
      - name: Verify changed gameplay scenarios
        run: |
          if [ "$VARENDOR_QA_SCOPE" = polish ]; then
            node --experimental-strip-types --test tests/polish-server.test.mjs
          elif [ "$VARENDOR_QA_SCOPE" = world ]; then
            node --experimental-strip-types --test tests/territory.test.mjs
          elif [ "$VARENDOR_QA_SCOPE" = stop-only ]; then
            node scripts/reference-gameplay-contract.mjs
            node --experimental-strip-types scripts/player-stop-contract.mjs
            node --experimental-strip-types --test tests/player-stop-boundary.test.mjs tests/player-stop-phase.test.mjs tests/reference-server.test.mjs tests/core-gameplay-server.test.mjs tests/native-recovery.test.mjs tests/control-foundation.test.mjs tests/navigation.test.mjs
          elif [ "$VARENDOR_QA_SCOPE" = stop-npc ]; then
            node --experimental-strip-types scripts/player-stop-contract.mjs
            node --experimental-strip-types --test tests/reference-server.test.mjs tests/native-recovery.test.mjs tests/control-foundation.test.mjs tests/navigation.test.mjs
          else
            node scripts/reference-gameplay-contract.mjs
            node --experimental-strip-types --test tests/reference-server.test.mjs tests/core-gameplay-server.test.mjs tests/combat-feedback.test.mjs tests/combat-obstruction.test.mjs tests/native-recovery.test.mjs tests/monster-ai.test.mjs tests/control-foundation.test.mjs tests/server-combat-parity.test.mjs tests/persistent-world.test.mjs tests/navigation.test.mjs
          fi
      - name: Capture the approved browser reference from its exact source commit
        if: ${{ env.VARENDOR_QA_SCOPE == 'full' }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          git worktree add --detach "$RUNNER_TEMP/reference-source" 1e94a0d1ad08a4df8959527e40058f5c89b07e9a
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/reference-source/node_modules"
          cd "$RUNNER_TEMP/reference-source"
          VARENDOR_QA=0 VARENDOR_BETA=1 "$GITHUB_WORKSPACE/node_modules/.bin/vite" build --outDir "$RUNNER_TEMP/reference-dist"
          cd "$GITHUB_WORKSPACE"
          node scripts/reference-browser-capture.mjs --root "$RUNNER_TEMP/reference-dist" --output qa-artifacts/reference-browser --source-mode rebuilt
      - name: Import changed scripts before world assembly
        if: ${{ env.VARENDOR_QA_SCOPE == 'polish' }}
        run: |
          node --experimental-strip-types scripts/godot-pc-data.mjs
          "$GODOT" --headless --path godot-pc --editor --import 2>&1 | tee "$RUNNER_TEMP/early-godot-import.log"
          python -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"early-godot-import.log").read_text(); assert "SCRIPT ERROR:" not in s and "Parse Error:" not in s,s[-18000:]'
      - name: Restore unchanged authored world
        id: world_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            godot-pc/generated/world.glb
            godot-pc/generated/blender-build.json
            godot-pc/generated/wildlife/
            world-source/Varendor_PC_World.blend
          key: territory-blender-4.5.9-${{ hashFiles('scripts/godot-pc-world.py', 'scripts/territory_art.py', 'src/world/territory-layout.ts', 'src/world/territory.ts', 'public/assets/world/world-topology.json') }}
      - name: Assemble the existing world in Blender
        run: |
          node --experimental-strip-types scripts/godot-pc-data.mjs
          if [ "${{ steps.world_cache.outputs.cache-hit }}" != true ]; then "$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/godot-pc-world.py; fi
      - name: Cache the assembled world for client-only corrections
        if: ${{ steps.world_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            godot-pc/generated/world.glb
            godot-pc/generated/blender-build.json
            godot-pc/generated/wildlife/
            world-source/Varendor_PC_World.blend
          key: ${{ steps.world_cache.outputs.cache-primary-key }}
      - name: Build original P1 world samples
        run: |
          "$BLENDER" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/godot-pc-samples.py
          mkdir -p qa-artifacts/pc-build
          cp -r world-source/p1-samples qa-artifacts/pc-build/
          cp godot-pc/generated/p1-samples.glb qa-artifacts/pc-build/p1-samples/
          if [ "$VARENDOR_QA_SCOPE" = world ]; then python scripts/package-territory-source.py; fi
      - name: Import and export the native clients
        id: native_export
        run: |
          mkdir -p qa-artifacts/pc-build
          "$GODOT" --headless --path godot-pc --editor --import
          if [ "$VARENDOR_QA_SCOPE" = stop-npc ] || [ "$VARENDOR_QA_SCOPE" = stop-only ]; then
            python scripts/network-transport-qa.py --godot "$GODOT" --output qa-artifacts/pc-linux/stop-transport.json
          fi
          if [ "$VARENDOR_QA_SCOPE" = stop-only ]; then
            python scripts/network-orbit-qa.py --godot "$GODOT" --output qa-artifacts/pc-linux/forward-stop-transport.json
          fi
          if [ "$VARENDOR_QA_SCOPE" != world ] && [ "$VARENDOR_QA_SCOPE" != polish ]; then "$GODOT" --headless --path godot-pc --script res://scripts/animation_controller_qa.gd; fi
          "$GODOT" --headless --path godot-pc --export-release 'Linux QA' "$PWD/qa-artifacts/pc-build/Varendor.x86_64"
          "$GODOT" --headless --path godot-pc --export-release 'Windows PC' "$PWD/qa-artifacts/pc-build/Varendor.exe"
          cp godot-pc/generated/blender-build.json qa-artifacts/pc-build/
      - name: Exercise native Godot graphics and the save adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1600x900x24' node --experimental-strip-types scripts/godot-pc-qa.mjs qa-artifacts/pc-build/Varendor.x86_64 qa-artifacts/pc-linux --graphical --qa-scope=${{ env.VARENDOR_QA_SCOPE }}
      - name: Verify original samples in native Godot
        if: ${{ !cancelled() && steps.native_export.outcome == 'success' && env.VARENDOR_QA_SCOPE != 'world' && env.VARENDOR_QA_SCOPE != 'polish' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' qa-artifacts/pc-build/Varendor.x86_64 --audio-driver Dummy -- --world-samples --qa-art="$PWD/qa-artifacts/pc-linux/samples"
          cp -r world-source/p1-samples qa-artifacts/pc-build/
          cp godot-pc/generated/p1-samples.glb qa-artifacts/pc-build/p1-samples/
      - uses: actions/upload-artifact@v4
        with:
          name: godot-pc-windows-input
          path: |
            qa-artifacts/pc-build/Varendor.exe
            qa-artifacts/pc-build/blender-build.json
            qa-artifacts/pc-build/p1-samples/
            qa-artifacts/pc-build/Varendor_World_Source.zip
            qa-artifacts/pc-linux/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pc-native-evidence
          path: |
            qa-artifacts/pc-linux/
            qa-artifacts/reference-browser/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.VARENDOR_QA_SCOPE == 'stop-only' }}
        with:
          name: godot-pc-stop-review
          path: |
            qa-artifacts/pc-linux/native-runtime.json
            qa-artifacts/pc-linux/forward-stop-*.jpg
            qa-artifacts/pc-linux/forward-stop-transport.json
          retention-days: 30

  windows-package:
    needs: native-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: godot-pc-windows-input
          path: qa-artifacts
      - name: Package Windows with the portable server
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force godot-pc/generated | Out-Null
          Copy-Item qa-artifacts/pc-build/blender-build.json godot-pc/generated/blender-build.json
          node scripts/package-godot-pc.mjs qa-artifacts/pc-build/Varendor.exe qa-artifacts/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the shipped Windows executable and portable Node against fixture data
        run: |
          $package = Join-Path $PWD ('qa-artifacts/release/Varendor_Godot_PC_' + $env:GITHUB_SHA.Substring(0,12))
          & (Join-Path $package 'runtime/node.exe') --experimental-strip-types scripts/godot-pc-qa.mjs (Join-Path $package 'Varendor.exe') qa-artifacts/pc-windows ("--package=" + $package) --qa-scope=${{ env.VARENDOR_QA_SCOPE }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the test ZIP and verify public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-godot-pc.mjs qa-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pc-release-evidence
          path: |
            qa-artifacts/pc-windows/
            qa-artifacts/release/publish-result.json
            qa-artifacts/release/*.sha256
          retention-days: 30
