name: Varendor gameplay and stability source audit

on:
  push:
    branches: [work/character-art-v3]

permissions:
  contents: write
  actions: read

concurrency:
  group: world-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    if: ${{ contains(github.event.head_commit.message, '[source-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked source dependencies
        run: npm ci
      - name: Restore tracked payload and prepare authoritative source inputs
        run: |
          mkdir -p qa-artifacts/source-audit
          python scripts/world_final/materialize_payload.py > qa-artifacts/source-audit/materialize.json
          node --experimental-strip-types scripts/godot-pc-data.mjs > qa-artifacts/source-audit/generated-data.json
          node --experimental-strip-types scripts/world_final/prepare_gameplay.mjs --starter-v3 > qa-artifacts/source-audit/prepared-world.json
      - name: Gate dependency security, full Node suite and TypeScript/Vite build
        run: |
          npm audit --audit-level=high --json > qa-artifacts/source-audit/dependency-audit.json
          npm test 2>&1 | tee qa-artifacts/source-audit/node-tests.log
          npm run build 2>&1 | tee qa-artifacts/source-audit/build.log
          echo 'Source audit passed: full Node suite, TypeScript/Vite build and dependency security. Native graphical acceptance is recorded separately.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-source-audit
          path: qa-artifacts/source-audit
  native-build:
    if: ${{ contains(github.event.head_commit.message, '[world-gameplay]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          python scripts/godot-pc-toolchain.py
          python -m pip install py7zr==1.1.3
          npm ci
          npx tsc --noEmit
      - name: Restore unchanged world cache
        id: world_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            godot-pc/generated/world.glb
            godot-pc/generated/blender-build.json
            godot-pc/generated/wildlife/
            world-source/Varendor_PC_World.blend
          key: territory-blender-4.5.9-${{ hashFiles('scripts/godot-pc-world.py', 'scripts/territory_art.py', 'src/world/territory-layout.ts', 'src/world/territory.ts', 'public/assets/world/world-topology.json') }}
      - name: Restore unchanged approved monster outputs
        id: monster_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            art/monsters-v3/editable/
            art/monsters-v3/runtime/
            art/monsters-v3/forest/ForestLord.blend
            art/monsters-v3/forest/ForestLord.glb
            art/monsters-v3/forest/build.json
            qa-artifacts/monster-sources/forest-monster.7z
          key: monsters-blender-4.5.9-${{ hashFiles('scripts/build-monsters-v3.py', 'scripts/build-forest-monster.py', 'art/monsters-v3/source-lock.json', 'art/monsters-v3/forest/source-lock.json') }}
      - name: Restore the accepted knight and build approved monsters
        run: |
          node --experimental-strip-types scripts/godot-pc-data.mjs
          node scripts/materialize-knight-assets.mjs --include-source
          python scripts/restore-knight-build-inputs.py --blender "$BLENDER"
          # Keep the accepted v2 knight runtime. The v3 art checkpoint is unfinished.
          if [ '${{ steps.monster_cache.outputs.cache-hit }}' = 'true' ]; then
            python scripts/materialize-monsters-v3.py --blender "$BLENDER" --sources-only
          else
            python scripts/materialize-monsters-v3.py --blender "$BLENDER"
            python scripts/materialize-forest-monster.py --blender "$BLENDER"
          fi
          node --experimental-strip-types scripts/godot-pc-data.mjs
          python scripts/package-monster-art.py qa-artifacts/pc-build
      - name: Preserve completed Blender outputs for native-check repairs
        if: steps.monster_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            art/monsters-v3/editable/
            art/monsters-v3/runtime/
            art/monsters-v3/forest/ForestLord.blend
            art/monsters-v3/forest/ForestLord.glb
            art/monsters-v3/forest/build.json
            qa-artifacts/monster-sources/forest-monster.7z
          key: monsters-blender-4.5.9-${{ hashFiles('scripts/build-monsters-v3.py', 'scripts/build-forest-monster.py', 'art/monsters-v3/source-lock.json', 'art/monsters-v3/forest/source-lock.json') }}
      - name: Connect final-world gameplay and verify authority
        run: |
          python scripts/world_final/materialize_payload.py
          node --experimental-strip-types scripts/world_final/prepare_gameplay.mjs --starter-v3
          npm test
      - name: Import and export the gameplay client
        timeout-minutes: 25
        run: |
          mkdir -p qa-artifacts/gameplay-build
          set +e
          python scripts/godot_run_checked.py --exe "$GODOT" --project godot-pc --output qa-artifacts/gameplay-import --timeout 900 -- --headless --editor --import
          import_status=$?
          set -e
          tail -n 80 qa-artifacts/gameplay-import/engine.log
          if [ "$import_status" -ne 0 ]; then exit "$import_status"; fi
          python -c 'import pathlib; s=pathlib.Path("qa-artifacts/gameplay-import/engine.log").read_text(); assert "SCRIPT ERROR:" not in s and "Parse Error:" not in s,s[-8000:]'
          # GLB import extracts textures beside the source. Caching only
          # .godot/imported leaves stale scenes referring to absent images.
          # Always import this clean checkout and verify the real dependencies.
          python scripts/godot_run_checked.py --exe "$GODOT" --project godot-pc --output qa-artifacts/gameplay-dependencies --timeout 180 -- --headless --script "$PWD/scripts/world_final/verify_gameplay_import.gd"
          tail -n 12 qa-artifacts/gameplay-dependencies/engine.log
          python scripts/godot_run_checked.py --exe "$GODOT" --project godot-pc --output qa-artifacts/gameplay-format --timeout 180 -- --headless --script res://scripts/stage_format_qa.gd
          python scripts/godot_run_checked.py --exe "$GODOT" --project godot-pc --output qa-artifacts/gameplay-export --timeout 900 -- --headless --export-release 'Windows PC' "$PWD/qa-artifacts/gameplay-build/Varendor.exe"
          python scripts/godot_run_checked.py --exe "$GODOT" --project godot-pc --output qa-artifacts/gameplay-license --timeout 180 -- --headless --script "$PWD/scripts/world_final/write_godot_license.gd" -- --license-output="$PWD/qa-artifacts/gameplay-build/Godot-LICENSE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: world-gameplay-windows-input
          path: qa-artifacts/gameplay-build
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-gameplay-import
          path: |
            qa-artifacts/gameplay-import
            qa-artifacts/gameplay-dependencies
            qa-artifacts/gameplay-format
            qa-artifacts/gameplay-export
            qa-artifacts/gameplay-license
  windows-check-publish:
    needs: native-build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: world-gameplay-windows-input
          path: qa-artifacts/gameplay-build
      - name: Package executable and exact authoritative data
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/world_final/materialize_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types scripts/godot-pc-data.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types scripts/world_final/prepare_gameplay.mjs --starter-v3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/world_final/package_gameplay.mjs qa-artifacts/gameplay-build/Varendor.exe qa-artifacts/gameplay-release qa-artifacts/gameplay-build/Godot-LICENSE.txt --starter-v3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shipped Windows EXE and portable server in headless mode
        env:
          PYTHON: python
        run: |
          $gamePackage = (Get-Content qa-artifacts/gameplay-release/package-result.json | ConvertFrom-Json).destination
          # Exercise the release input path while no Camera3D exists yet.
          # This happens before login, so it needs no personal save/server.
          python scripts/godot_run_checked.py --exe (Join-Path $gamePackage 'Varendor.exe') --packaged --cwd $gamePackage --output qa-artifacts/gameplay-startup --timeout 240 -- --headless --audio-driver Dummy -- ("--qa-startup=" + (Join-Path $PWD 'qa-artifacts/gameplay-startup/startup.json'))
          $startupStatus = $LASTEXITCODE
          if (Test-Path qa-artifacts/gameplay-startup/startup.json) { Get-Content qa-artifacts/gameplay-startup/startup.json }
          if ($startupStatus -ne 0) { exit $startupStatus }
          $startupResult = Get-Content qa-artifacts/gameplay-startup/startup.json | ConvertFrom-Json
          if (-not $startupResult.ok) { throw 'Startup input verification failed' }
          & (Join-Path $gamePackage 'runtime/node.exe') --experimental-strip-types scripts/world_final/stage_qa.mjs (Join-Path $gamePackage 'Varendor.exe') qa-artifacts/gameplay-windows --starter-v3 --headless ("--package=" + $gamePackage)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $gamePackage 'runtime/node.exe') --experimental-strip-types scripts/world_final/stage_qa.mjs (Join-Path $gamePackage 'Varendor.exe') qa-artifacts/castle-windows --starter-v3 --castle --headless ("--package=" + $gamePackage)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $gamePackage 'runtime/node.exe') --experimental-strip-types scripts/world_final/stage_qa.mjs (Join-Path $gamePackage 'Varendor.exe') qa-artifacts/quarter-windows --starter-v3 --castle-preview --headless ("--package=" + $gamePackage)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($gameBlock in @('craft', 'starter', 'ui-v3')) {
            & (Join-Path $gamePackage 'runtime/node.exe') --experimental-strip-types scripts/world_final/stage_qa.mjs (Join-Path $gamePackage 'Varendor.exe') ("qa-artifacts/p2-" + $gameBlock + "-windows") --starter-v3 --headless ("--block=" + $gameBlock) ("--package=" + $gamePackage)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Publish verified gameplay ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gameResult = Get-Content qa-artifacts/gameplay-release/package-result.json | ConvertFrom-Json
          python scripts/world_final/archive_gameplay.py qa-artifacts/gameplay-release/package-result.json qa-artifacts/gameplay-windows/stage.json qa-artifacts/castle-windows/castle.json qa-artifacts/quarter-windows/castle.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gameZip = Join-Path $PWD ('qa-artifacts/gameplay-release/' + $gameResult.name + '.zip')
          $gameHash = (Get-FileHash -LiteralPath $gameZip -Algorithm SHA256).Hash.ToLower()
          $gameTag = 'world-gameplay-' + $env:GITHUB_SHA.Substring(0,12)
          gh release create $gameTag $gameZip ($gameZip + '.sha256') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title 'VARENDOR — аудит стабильности, игровой этап P2' --notes-file qa-artifacts/gameplay-release/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gameRelease = gh api ('repos/' + $env:GITHUB_REPOSITORY + '/releases/tags/' + $gameTag) | ConvertFrom-Json
          $gameAsset = $gameRelease.assets | Where-Object name -eq ($gameResult.name + '.zip')
          if ($gameAsset.digest -ne ('sha256:' + $gameHash)) { throw 'Published checksum differs' }
          Invoke-WebRequest -Uri $gameAsset.browser_download_url -OutFile qa-artifacts/gameplay-release/download-verified.zip
          if ((Get-FileHash qa-artifacts/gameplay-release/download-verified.zip -Algorithm SHA256).Hash.ToLower() -ne $gameHash) { throw 'Public download checksum differs' }
          @{commit=$env:GITHUB_SHA;download=$gameAsset.browser_download_url;release=$gameRelease.html_url;sha256=$gameHash;direct_download_verified=$true} | ConvertTo-Json | Set-Content qa-artifacts/gameplay-release/publish-result.json
          ('[Windows gameplay ZIP](' + $gameAsset.browser_download_url + ')') | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-gameplay-checks
          path: |
            qa-artifacts/gameplay-startup
            qa-artifacts/gameplay-windows/stage.json
            qa-artifacts/gameplay-windows/native/result.json
            qa-artifacts/gameplay-windows/native/engine.log
            qa-artifacts/castle-windows/castle.json
            qa-artifacts/castle-windows/native/result.json
            qa-artifacts/castle-windows/native/engine.log
            qa-artifacts/quarter-windows/castle.json
            qa-artifacts/quarter-windows/native/result.json
            qa-artifacts/quarter-windows/native/engine.log
            qa-artifacts/p2-*-windows/stage.json
            qa-artifacts/p2-*-windows/native/result.json
            qa-artifacts/p2-*-windows/native/engine.log
            qa-artifacts/gameplay-release/publish-result.json
