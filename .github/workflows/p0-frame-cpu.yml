name: P0 frame CPU isolation
on:
  push:
    branches: [work/godot-p1-recovery]
permissions:
  contents: read
jobs:
  cpu:
    if: ${{ contains(github.event.head_commit.message, '[pacing-cpu]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Install pinned Godot runtime only
        run: python scripts/godot-pc-toolchain.py --runtime-only
      - name: Measure the released parser and native-search candidate with the same packet
        run: |
          node --experimental-strip-types scripts/pacing/prepare_sse_benchmark.mjs "$RUNNER_TEMP/sse-probe"
          "$GODOT" --headless --path "$RUNNER_TEMP/sse-probe" --editor --import
          "$GODOT" --headless --path "$RUNNER_TEMP/sse-probe" --script res://sse_benchmark.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-frame-cpu-evidence
          path: ${{ runner.temp }}/sse-probe/sse-result.json
          retention-days: 30
